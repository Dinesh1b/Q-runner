<!DOCTYPE html>
<!--
  Q-ARunner — json_import_tests.html
  Standalone unit test runner for JSON Import module.
  
  Tests cover:
    1. Schema validation (valid/invalid configs, version checks, type enforcement)
    2. Nested-property flattening (dot-path resolution)
    3. Control update binding (inputs, selects, checkboxes, dropdowns)
    4. Import failure scenarios (bad JSON, missing fields, invalid values)
    5. Security checks (no prototype pollution, secrets hidden)
    6. Repeat imports and partial configs
    
  Open this file directly in a browser to run all tests.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>JSON Import — Unit Tests</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Inter', sans-serif;
      background: #0c0d1f; color: #c8cbee;
      padding: 24px; line-height: 1.6;
    }
    h1 { font-size: 18px; color: #818cf8; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #565a88; margin-bottom: 20px; }
    .suite { margin-bottom: 20px; }
    .suite-name {
      font-size: 13px; font-weight: 700; color: #a78bfa;
      padding: 8px 12px; border-radius: 8px 8px 0 0;
      background: rgba(139,92,246,0.08);
      border: 1px solid rgba(139,92,246,0.15);
      border-bottom: none;
    }
    .tests {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }
    .test {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px; font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .test:last-child { border-bottom: none; }
    .test.pass { background: rgba(16,185,129,0.04); }
    .test.fail { background: rgba(244,63,94,0.06); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .pass .dot { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.4); }
    .fail .dot { background: #fb7185; box-shadow: 0 0 6px rgba(251,113,133,0.4); }
    .test-name { flex: 1; }
    .fail .test-name { color: #fb7185; }
    .test-detail { font-size: 10px; color: #565a88; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .summary {
      margin-top: 20px; padding: 14px 18px;
      border-radius: 12px; font-size: 14px; font-weight: 600;
    }
    .summary.all-pass {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      color: #34d399;
    }
    .summary.has-fail {
      background: rgba(244,63,94,0.1);
      border: 1px solid rgba(244,63,94,0.25);
      color: #fb7185;
    }
    .summary span { font-size: 12px; font-weight: 400; color: #8b90c0; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>🧪 JSON Import — Unit Tests</h1>
  <div class="subtitle">Q-ARunner Schema Validation, Mapping & Control Binding</div>
  <div id="results"></div>

  <!-- Minimal DOM stubs for testing control binding -->
  <div style="display:none;">

    <!-- Modal stub -->
    <div id="json-import-modal" class="ji-modal-overlay">
      <div class="ji-modal"><div class="ji-modal-body" id="json-import-modal-body"></div></div>

  <!-- Load utils.js for escHtml -->
  <script>
    // Minimal stubs
    window.escHtml = function(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
    window.setEnv = function() {};
    window.selectAType = function(v) { document.getElementById('Audit_mode').value = v; };
    window.selectAMMode = function(v) { document.getElementById('AUDITOR_MAPPING_TYPE').value = v; };
    window.grpEnabled = [false, false, false];
    window.modEnabled = new Array(16).fill(false);
    window.syncModCount = function() {};
    window.syncRunQueue = function() {};
    window.togGroupSwitch = function() {};
    window.buildCfg = function() { return {}; };
  </script>
  <script src="../static/js/json_import.js"></script>
  <script>
    'use strict';

    const { validateSchema, flattenObj, importJsonConfig, FIELD_MAP, SUPPORTED_VERSIONS, SCHEMA } = window.QA_JSON_IMPORT;

    let totalTests = 0, passed = 0, failed = 0;
    const suites = [];
    let currentSuite = null;

    function suite(name) {
      currentSuite = { name, tests: [] };
      suites.push(currentSuite);
    }

    function test(name, fn) {
      totalTests++;
      try {
        fn();
        passed++;
        currentSuite.tests.push({ name, pass: true });
      } catch (e) {
        failed++;
        currentSuite.tests.push({ name, pass: false, detail: e.message });
      }
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }

    function assertEqual(a, b, msg) {
      if (a !== b) throw new Error(msg || `Expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
    }

    function assertIncludes(arr, item, msg) {
      if (!arr.includes(item)) throw new Error(msg || `Array does not include ${JSON.stringify(item)}`);
    }

    // Reset all controls to defaults
    function resetControls() {
      document.querySelectorAll('input[type=text], input[type=number], input[type=password]').forEach(el => el.value = '');
      document.querySelectorAll('input[type=checkbox]').forEach(el => el.checked = false);
      document.getElementById('browsername').value = 'chrome';
      document.getElementById('environments').value = 'PRODUCTION';
      document.getElementById('DEFAULT_TIMEOUT').value = '10000';
      document.getElementById('Audit_mode').value = 'Audit_plan';
      document.getElementById('AUDITOR_MAPPING_TYPE').value = 'Random';
      window.grpEnabled = [false, false, false];
      window.modEnabled = new Array(16).fill(false);
    }

    /* ══════════════════════════════════════════════════════
       SUITE 1: Schema Validation
    ══════════════════════════════════════════════════════ */
    suite('Schema Validation');

    test('Valid minimal config passes', () => {
      const r = validateSchema({ config_version: '1.0' });
      assert(r.valid, 'Should be valid: ' + r.errors.join('; '));
    });

    test('Missing config_version fails', () => {
      const r = validateSchema({});
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('config_version')));
    });

    test('Unsupported config_version fails', () => {
      const r = validateSchema({ config_version: '99.0' });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('Unsupported')));
    });

    test('config_version must be string', () => {
      const r = validateSchema({ config_version: 1.0 });
      assert(!r.valid);
    });

    test('Unknown top-level section rejected', () => {
      const r = validateSchema({ config_version: '1.0', unknown_section: {} });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('Unknown top-level')));
    });

    test('Valid full config passes', () => {
      const r = validateSchema({
        config_version: '1.0',
        project: { name: 'Test', environment: 'QA' },
        execution: { browser: 'chrome', timeout: 30000 },
        modules: { q_setting: true, stock_audit_a1: false },
        test_data: { username: 'user', password: '' },
      });
      assert(r.valid, 'Should be valid: ' + r.errors.join('; '));
    });

    test('Invalid browser value rejected', () => {
      const r = validateSchema({
        config_version: '1.0',
        execution: { browser: 'opera' },
      });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('browser')));
    });

    test('Invalid environment value rejected', () => {
      const r = validateSchema({
        config_version: '1.0',
        project: { environment: 'INVALID' },
      });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('environment')));
    });

    test('Timeout must be number', () => {
      const r = validateSchema({
        config_version: '1.0',
        execution: { timeout: 'fast' },
      });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('number')));
    });

    test('Module values must be boolean', () => {
      const r = validateSchema({
        config_version: '1.0',
        modules: { q_setting: 'yes' },
      });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('boolean')));
    });

    test('Negative timeout rejected', () => {
      const r = validateSchema({
        config_version: '1.0',
        execution: { timeout: -100 },
      });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('>=')));
    });

    test('Non-object root rejected', () => {
      const r = validateSchema([1, 2, 3]);
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('JSON object')));
    });

    test('Null root rejected', () => {
      const r = validateSchema(null);
      assert(!r.valid);
    });

    test('Section must be object', () => {
      const r = validateSchema({ config_version: '1.0', project: 'not-an-object' });
      assert(!r.valid);
      assert(r.errors.some(e => e.includes('object')));
    });

    test('Optional sections can be omitted', () => {
      const r = validateSchema({ config_version: '1.0' });
      assert(r.valid);
    });

    /* ══════════════════════════════════════════════════════
       SUITE 2: Nested Property Flattening
    ══════════════════════════════════════════════════════ */
    suite('Property Flattening');

    test('Simple flat object', () => {
      const res = flattenObj({ a: 1, b: 'hello' }, '');
      assertEqual(res.length, 2);
      assert(res.some(([p]) => p === 'a'));
      assert(res.some(([p]) => p === 'b'));
    });

    test('Nested object produces dot-paths', () => {
      const res = flattenObj({ project: { name: 'X', env: 'QA' } }, '');
      assertEqual(res.length, 2);
      assert(res.some(([p]) => p === 'project.name'));
      assert(res.some(([p]) => p === 'project.env'));
    });

    test('Deeply nested produces correct paths', () => {
      const res = flattenObj({ a: { b: { c: 42 } } }, '');
      assertEqual(res.length, 1);
      assertEqual(res[0][0], 'a.b.c');
      assertEqual(res[0][1], 42);
    });

    test('Boolean values preserved', () => {
      const res = flattenObj({ modules: { login: true, audit: false } }, '');
      const login = res.find(([p]) => p === 'modules.login');
      assertEqual(login[1], true);
      const audit = res.find(([p]) => p === 'modules.audit');
      assertEqual(audit[1], false);
    });

    test('Empty string preserved', () => {
      const res = flattenObj({ test_data: { password: '' } }, '');
      const pw = res.find(([p]) => p === 'test_data.password');
      assertEqual(pw[1], '');
    });

    test('Null values preserved', () => {
      const res = flattenObj({ x: null }, '');
      assertEqual(res[0][1], null);
    });

    /* ══════════════════════════════════════════════════════
       SUITE 3: Control Updates (Binding)
    ══════════════════════════════════════════════════════ */
    suite('Control Updates');

    test('Input text populated', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        test_data: { email: 'test@example.com' },
      }));
      assert(r.success, 'Import should succeed: ' + r.errors.join('; '));
      assertEqual(document.getElementById('email').value, 'test@example.com');
    });

    test('Number input populated', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        execution: { timeout: 45000 },
      }));
      assert(r.success);
      assertEqual(document.getElementById('DEFAULT_TIMEOUT').value, '45000');
    });

    test('Select dropdown updated', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        execution: { browser: 'firefox' },
      }));
      assert(r.success);
      assertEqual(document.getElementById('browsername').value, 'firefox');
    });

    test('Environment dropdown + env button synced', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        project: { environment: 'QA' },
      }));
      assert(r.success);
      assertEqual(document.getElementById('environments').value, 'QA');
    });

    test('Checkbox enabled', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        audit_config: { audit_damaged: true },
      }));
      assert(r.success);
      assert(document.getElementById('cb-damaged').checked);
    });

    test('Checkbox disabled', () => {
      resetControls();
      document.getElementById('cb-stock').checked = true;
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        audit_config: { stock_count: false },
      }));
      assert(r.success);
      assert(!document.getElementById('cb-stock').checked);
    });

    test('Group switch enabled', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        modules: { q_audit: true },
      }));
      assert(r.success);
      assert(document.getElementById('grp-sw-0').checked);
      assert(window.grpEnabled[0]);
    });

    test('Module checkbox enabled', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        modules: { q_setting: true },
      }));
      assert(r.success);
      assert(document.getElementById('cb-qs').checked);
      assert(window.modEnabled[0]);
    });

    test('Password input populated (empty value)', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        test_data: { password: '' },
      }));
      assert(r.success);
      assertEqual(document.getElementById('password').value, '');
    });

    test('Multiple fields populated at once', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        execution: { browser: 'firefox', timeout: 20000 },
        test_data: { email: 'multi@test.com', audit_name: 'Multi Audit' },
      }));
      assert(r.success);
      assertEqual(document.getElementById('browsername').value, 'firefox');
      assertEqual(document.getElementById('DEFAULT_TIMEOUT').value, '20000');
      assertEqual(document.getElementById('email').value, 'multi@test.com');
      assertEqual(document.getElementById('qs-audit-name').value, 'Multi Audit');
    });

    test('Repeat import updates existing values', () => {
      resetControls();
      importJsonConfig(JSON.stringify({
        config_version: '1.0',
        test_data: { email: 'first@test.com' },
      }));
      assertEqual(document.getElementById('email').value, 'first@test.com');
      
      importJsonConfig(JSON.stringify({
        config_version: '1.0',
        test_data: { email: 'second@test.com' },
      }));
      assertEqual(document.getElementById('email').value, 'second@test.com');
    });

    test('Absent optional keys don\'t clear existing values', () => {
      resetControls();
      document.getElementById('email').value = 'keep@me.com';
      document.getElementById('branch').value = 'preserved';
      
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        execution: { timeout: 15000 },
      }));
      assert(r.success);
      assertEqual(document.getElementById('email').value, 'keep@me.com');
      assertEqual(document.getElementById('branch').value, 'preserved');
    });

    /* ══════════════════════════════════════════════════════
       SUITE 4: Import Failures
    ══════════════════════════════════════════════════════ */
    suite('Import Failures');

    test('Invalid JSON rejected', () => {
      const r = importJsonConfig('{ not valid json }}}');
      assert(!r.success);
      assert(r.errors.some(e => e.includes('Invalid JSON')));
    });

    test('Missing version rejected', () => {
      const r = importJsonConfig(JSON.stringify({ project: { name: 'x' } }));
      assert(!r.success);
    });

    test('Invalid dropdown value rejected (atomically)', () => {
      resetControls();
      document.getElementById('browsername').value = 'chrome';
      document.getElementById('email').value = 'original@test.com';

      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        execution: { browser: 'opera' }, // invalid — not in dropdown
        test_data: { email: 'new@test.com' },
      }));
      // Should fail schema validation, no changes applied
      assert(!r.success);
    });

    test('Empty string is valid JSON parse', () => {
      const r = importJsonConfig('');
      assert(!r.success);
      assert(r.errors.some(e => e.includes('Invalid JSON')));
    });

    test('Array at root rejected', () => {
      const r = importJsonConfig('[]');
      assert(!r.success);
    });

    test('Null at root rejected', () => {
      const r = importJsonConfig('null');
      assert(!r.success);
    });

    /* ══════════════════════════════════════════════════════
       SUITE 5: Security
    ══════════════════════════════════════════════════════ */
    suite('Security');

    test('Prototype pollution blocked', () => {
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        ['__proto__']: { polluted: true },
      }));
      assert(!r.success);
      assert(r.errors.some(e => e.includes('unsafe')));
    });

    test('Constructor key blocked', () => {
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        constructor: {},
      }));
      assert(!r.success);
    });

    test('Password values hidden in summary', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        test_data: { password: 'supersecret123' },
      }));
      assert(r.success);
      const pwEntry = r.populated.find(p => p.path === 'test_data.password');
      assert(pwEntry, 'Password should be in populated list');
      assert(!pwEntry.value.includes('supersecret'), 'Password value should be masked');
      assert(pwEntry.value.includes('••'), 'Should show mask dots');
    });

    test('File size > 1MB rejected (handler check)', () => {
      // This is a UI-level check; we verify the FIELD_MAP has secret flags
      assert(FIELD_MAP['test_data.password'].secret, 'password should be marked secret');
      assert(FIELD_MAP['test_data.password2'].secret, 'password2 should be marked secret');
      assert(FIELD_MAP['test_data.oa_password'].secret, 'oa_password should be marked secret');
    });

    /* ══════════════════════════════════════════════════════
       SUITE 6: Edge Cases
    ══════════════════════════════════════════════════════ */
    suite('Edge Cases');

    test('Boolean false in modules disables correctly', () => {
      resetControls();
      document.getElementById('grp-sw-2').checked = true;
      window.grpEnabled[2] = true;

      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        modules: { inventory: false },
      }));
      assert(r.success);
      assert(!document.getElementById('grp-sw-2').checked);
    });

    test('Zero quantity is valid', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        test_data: { quantity: 0 },
      }));
      assert(r.success);
      assertEqual(document.getElementById('aud_qty1').value, '0');
    });

    test('Skipped fields tracked in result', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        project: { name: 'TestName' },
      }));
      assert(r.success);
      // project.name is skipped (informational only)
    });

    test('FIELD_MAP covers all documented bindings', () => {
      // Verify key mappings exist
      assert('execution.browser' in FIELD_MAP);
      assert('execution.timeout' in FIELD_MAP);
      assert('project.environment' in FIELD_MAP);
      assert('modules.q_audit' in FIELD_MAP);
      assert('test_data.email' in FIELD_MAP);
      assert('test_data.quantity' in FIELD_MAP);
      assert('test_data.unit' in FIELD_MAP);
      assert('audit_config.audit_mode' in FIELD_MAP);
    });

    test('Supported versions array is correct', () => {
      assertIncludes(SUPPORTED_VERSIONS, '1.0');
    });

    test('Hidden field with handler invoked', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        audit_config: { audit_mode: 'Ad_hoc' },
      }));
      assert(r.success);
      assertEqual(document.getElementById('Audit_mode').value, 'Ad_hoc');
    });

    /* ══════════════════════════════════════════════════════
       SUITE 7: Audit Config Bindings
    ══════════════════════════════════════════════════════ */
    suite('Audit Config Bindings');

    test('Audit type select updated', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        audit_config: { audit_type: 'Cycle Count' },
      }));
      assert(r.success);
      assertEqual(document.getElementById('ap-audit-type').value, 'Cycle Count');
    });

    test('Photo type select updated', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        audit_config: { photo_type: 'Random' },
      }));

      assertEqual(document.getElementById('ap-photo-type').value, 'Random');

    test('Cross audit type updated', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        audit_config: { cross_audit_type: 'None' },
      }));
      assert(r.success);
      assertEqual(document.getElementById('ap-cross-type').value, 'None');
    });

    test('Mapping columns updated', () => {
      resetControls();
      const r = importJsonConfig(JSON.stringify({
        config_version: '1.0',
        audit_config: {
          auditor_col: 'AuditorX',
          category_col: 'CatY',
          storage_col: 'StoreZ',
        },
      }));
      assert(r.success);
      assertEqual(document.getElementById('EXCEL_auditor_col').value, 'AuditorX');
      assertEqual(document.getElementById('EXCEL_category_col').value, 'CatY');
      assertEqual(document.getElementById('EXCEL_storage_col').value, 'StoreZ');
    });

    /* ══════════════════════════════════════════════════════
       RENDER RESULTS
    ══════════════════════════════════════════════════════ */
    const container = document.getElementById('results');
    for (const s of suites) {
      let html = `<div class="suite"><div class="suite-name">${s.name}</div><div class="tests">`;
      for (const t of s.tests) {
        html += `<div class="test ${t.pass ? 'pass' : 'fail'}">
          <div class="dot"></div>
          <div class="test-name">${t.name}</div>
          ${t.detail ? `<div class="test-detail" title="${t.detail}">${t.detail}</div>` : ''}
        </div>`;
      }
      html += '</div></div>';
      container.innerHTML += html;
    }
    container.innerHTML += `<div class="summary ${failed ? 'has-fail' : 'all-pass'}">
      ${failed ? '❌' : '✅'} ${passed}/${totalTests} tests passed
      <span>${failed ? `(${failed} failed)` : '— All green!'}</span>
    </div>`;

    console.info(`[QA Tests] ${passed}/${totalTests} passed, ${failed} failed`);
  </script>
